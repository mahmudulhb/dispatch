<style>
:root{--bg:#fff;--sub:#fafafa;--tile:#f4f4f5;--border:#e8e8ec;--text:#0a0a0b;--text2:#52525b;--muted:#8e8e99;--btn:#0a0a0b;--btn-t:#fff;--accent:#6366f1;--hover:#00000006;--ok:#16a34a;
--kw:#8250df;--str:#0a7f4f;--fn:#0969da;--num:#0550ae;--int:#bc4c00;--pl:#24292f;--ln:#9a9aa5;--shadow:0 1px 2px #0000000a,0 8px 24px -8px #0000001a;
--ease:cubic-bezier(.2,.8,.2,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0b;--sub:#101012;--tile:#17171a;--border:#222226;--text:#f4f4f5;--text2:#a1a1aa;--muted:#71717a;--btn:#fafafa;--btn-t:#0a0a0b;--accent:#818cf8;--hover:#ffffff08;--ok:#4ade80;--kw:#c4a7ff;--str:#7ee7a8;--fn:#79c0ff;--num:#9cc9ff;--int:#ffa657;--pl:#e4e4e7;--ln:#52525b;--shadow:0 1px 2px #0006,0 8px 24px -8px #000a}}
:root[data-theme="dark"]{--bg:#0a0a0b;--sub:#101012;--tile:#17171a;--border:#222226;--text:#f4f4f5;--text2:#a1a1aa;--muted:#71717a;--btn:#fafafa;--btn-t:#0a0a0b;--accent:#818cf8;--hover:#ffffff08;--ok:#4ade80;--kw:#c4a7ff;--str:#7ee7a8;--fn:#79c0ff;--num:#9cc9ff;--int:#ffa657;--pl:#e4e4e7;--ln:#52525b;--shadow:0 1px 2px #0006,0 8px 24px -8px #000a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
::view-transition-group(code){animation-duration:.5s;animation-timing-function:var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes line{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg);opacity:0}60%{transform:scale(1.25) rotate(6deg)}100%{transform:none;opacity:1}}
@keyframes pop2{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(260%) skewX(-20deg)}}
@keyframes blink{50%{opacity:0}}
header{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,5vw);border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);position:sticky;top:0;z-index:30;animation:drop .6s var(--ease) both}
.right{display:flex;align-items:center;gap:20px}
.toggle{position:relative;display:flex;background:var(--tile);border:1px solid var(--border);border-radius:999px;padding:3px}
.thumb{position:absolute;top:3px;left:3px;width:36px;height:32px;border-radius:999px;background:var(--bg);box-shadow:0 1px 3px #0003,0 0 0 1px var(--border);transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.toggle[data-t=dark] .thumb{transform:translateX(36px)}
.toggle button{position:relative;border:0;background:none;width:36px;height:32px;display:grid;place-items:center;color:var(--muted);transition:color .3s}
.toggle button svg{transition:transform .5s var(--ease)}
.toggle button.on{color:var(--text)}
.toggle button.on svg{transform:rotate(360deg)}
.toggle button:not(.on):hover{color:var(--text2)}
.create{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;background:var(--btn);color:var(--btn-t);border:0;height:42px;padding:0 24px;font-size:15px;font-weight:500;border-radius:10px;box-shadow:inset 0 1px 0 #ffffff26,0 1px 2px #0003;transition:transform .2s var(--ease),box-shadow .2s}
.create::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#ffffff55,transparent);transform:translateX(-120%) skewX(-20deg)}
.create:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 #ffffff26,0 8px 20px -6px #0006}
.create:hover::after{animation:shine .8s}
.create:active{transform:scale(.96)}
.create svg{transition:transform .35s var(--ease)}.create:hover svg{transform:rotate(90deg)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(350px,29vw,520px)}
.code{position:relative;min-width:0;border-right:1px solid var(--border);background:var(--bg);height:calc(100vh - 72px);overflow:hidden}
.code.full{position:fixed;inset:0;z-index:50;height:100%;border:0}
.tools{position:absolute;top:14px;right:22px;display:flex;gap:4px;z-index:2;padding:4px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);animation:pop2 .6s .5s var(--ease) both}
.tbtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;background:none;border:0;border-radius:8px;font-size:13px;font-weight:500;color:var(--text2);transition:background .2s,color .2s,transform .15s}
.tbtn:hover{background:var(--tile);color:var(--text)}.tbtn:active{transform:scale(.92)}
.tbtn svg{transition:transform .3s var(--ease)}.tbtn:hover svg{transform:translateY(-1px) scale(1.12)}
.tbtn.ok{color:var(--ok)}
.tbtn.sq{width:34px;padding:0;justify-content:center}
.sep{width:1px;background:var(--border);margin:6px 2px}
.ed{height:100%;overflow:auto;padding:18px 0;font:400 15.5px/30px 'JetBrains Mono',monospace;background:linear-gradient(90deg,var(--sub) 76px,var(--border) 76px,var(--border) 77px,transparent 77px);animation:rise .5s .1s both}
.row{display:grid;grid-template-columns:77px 1fr;min-width:max-content;animation:line .55s var(--ease) both}
.n{text-align:center;color:var(--ln);font-size:13px;user-select:none;transition:color .2s,transform .2s}
.c{white-space:pre;color:var(--pl);padding:0 28px 0 20px;border-left:2px solid transparent;transition:background .2s,border-color .2s}
.row:hover .c{background:var(--hover);border-left-color:var(--accent)}
.row:hover .n{color:var(--text);transform:scale(1.15)}
.caret{display:inline-block;width:2px;height:18px;margin-left:2px;vertical-align:middle;background:var(--accent);animation:blink 1.1s steps(1) infinite}
.kw{color:var(--kw)}.str{color:var(--str)}.fn{color:var(--fn)}.num{color:var(--num)}.int{color:var(--int)}
aside{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.info{padding:28px 24px}
.a{animation:rise .7s var(--ease) both;animation-delay:calc(var(--d)*80ms + .25s)}
.label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:10px}
.label svg{color:var(--muted)}
.field{display:flex;align-items:center;gap:10px;background:var(--sub);border:1px solid var(--border);border-radius:12px;padding:6px 6px 6px 14px;font:400 14px 'JetBrains Mono',monospace;transition:border-color .2s,box-shadow .2s,transform .2s}
.field:hover{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
.field span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field.sm{font-size:12px;color:var(--text2)}
.cp{flex:none;display:grid;place-items:center;width:34px;height:34px;background:var(--bg);border:1px solid var(--border);border-radius:9px;box-shadow:0 1px 2px #0000000a;transition:background .2s,transform .15s,border-color .2s}
.cp:hover{background:var(--tile)}.cp:active{transform:scale(.88)}
.cp.ok{color:var(--ok);border-color:var(--ok)}
.pop svg{animation:pop .5s var(--ease)}
.list{margin-top:22px;border:1px solid var(--border);border-radius:14px;background:var(--sub);overflow:hidden}
.meta{display:flex;gap:14px;align-items:center;padding:14px 16px;transition:background .2s}
.meta+.meta{border-top:1px solid var(--border)}
.meta:hover{background:var(--hover)}
.tile{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--border);color:var(--text2);transition:transform .4s var(--ease),color .2s,border-color .2s}
.meta:hover .tile{transform:translateY(-2px) rotate(-6deg);color:var(--accent);border-color:var(--accent)}
.meta small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-bottom:2px}
.meta b{font-weight:500;font-size:14.5px}
.pill{display:inline-block;font-size:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:999px;padding:2px 9px;margin-left:8px;font-weight:500;vertical-align:middle}
.emb{margin-top:26px}
footer{border-top:1px solid var(--border);text-align:center;padding:22px 16px;font-size:13px;color:var(--muted);animation:rise .7s 1s both}
footer b{color:var(--text2);font-weight:500}
.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,24px) scale(.9);display:flex;align-items:center;gap:8px;background:var(--btn);color:var(--btn-t);padding:11px 18px;border-radius:12px;font-weight:500;box-shadow:0 12px 32px -8px #0006;opacity:0;transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .25s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.cm{color:var(--ln);font-style:italic}
.cp:disabled{opacity:.4;pointer-events:none}
.tbtn.pub{background:var(--btn);color:var(--btn-t)}.tbtn.pub:hover{background:var(--btn);opacity:.85;color:var(--btn-t)}.tbtn:disabled{opacity:.6;pointer-events:none}
.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.edit{display:grid;grid-template-columns:77px 1fr;min-height:100%}
.edit .gut{text-align:center;color:var(--ln);font-size:13px;line-height:30px;user-select:none}
.edit textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--pl);font:inherit;line-height:30px;padding:0 28px 0 20px;white-space:pre;overflow-x:auto;overflow-y:hidden;caret-color:var(--accent)}
.edit textarea::placeholder{color:var(--ln)}
.miss{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-family:Inter,sans-serif;text-align:center;padding:24px;animation:rise .5s both}
.miss h3{color:var(--text);font-size:18px}
body.embed header,body.embed aside{display:none}
body.embed main{grid-template-columns:1fr}body.embed .code{height:100vh;border:0}
.code{display:flex;flex-direction:column}
.tools{position:static;flex:none;width:100%;justify-content:flex-end;gap:6px;margin:0;padding:8px 16px;background:var(--sub);border:0;border-bottom:1px solid var(--border);border-radius:0;box-shadow:none;backdrop-filter:none}
.ed{flex:1;min-height:0;height:auto;overflow-x:hidden}
.row,.edit{grid-template-columns:77px minmax(0,1fr)}
.row{min-width:0}
.c{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.edit{position:relative}
.edit textarea{white-space:pre-wrap;overflow-wrap:break-word;overflow:hidden;min-width:0}
.mirror{position:absolute;left:77px;top:0;visibility:hidden;pointer-events:none;padding:0 28px 0 20px;font:inherit;line-height:30px;white-space:pre-wrap;overflow-wrap:break-word}
.capwrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#0009;backdrop-filter:blur(4px);animation:pop2 .25s both}

.logo{font-size:0;height:34px;aspect-ratio:5.2;width:auto;background:var(--text);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;animation:pop2 .7s .15s var(--ease) both;transition:transform .5s var(--ease),opacity .2s}
.logo:hover{transform:scale(1.04)}
@media(max-width:900px){.logo{height:24px}}
.kbwrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:#0009;backdrop-filter:blur(4px);animation:pop2 .2s both}
.kbcard{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);width:min(400px,92vw)}
.kbcard h3{font-size:16px;margin-bottom:10px}
.kbcard ul{list-style:none;padding:0;display:grid}
.kbcard li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--text2)}
.kbcard li:last-child{border:0}.kbcard li span:last-child{display:flex;gap:4px}
kbd{font:500 11px 'JetBrains Mono',monospace;background:var(--tile);border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:1px 7px;color:var(--text2);min-width:22px;text-align:center}
.out[hidden]{display:none}
.out{flex:none;height:min(42%,340px);display:flex;flex-direction:column;border-top:1px solid var(--border);background:var(--sub);animation:rise .3s var(--ease)}
.outbar{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
.otitle{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text)}
.outbar .tbtn{height:28px}.outbar .tbtn.sq{width:28px}
.obody{flex:1;min-height:0;overflow:auto;padding:10px 16px;font:400 13px/1.65 'JetBrains Mono',monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.obody.pv{padding:8px}.obody iframe{width:100%;height:100%;border:0;border-radius:8px;background:#fff}
.ol{color:var(--pl)}.ol.error{color:#ef4444}.ol.warn{color:#d97706}.ol.result{color:var(--accent)}.ol.sys{color:var(--muted);font-style:italic}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:900px){.ed{background:linear-gradient(90deg,var(--sub) 44px,var(--border) 44px,var(--border) 45px,transparent 45px)}.row,.edit{grid-template-columns:45px minmax(0,1fr)}.mirror{left:45px}.c,.edit textarea,.mirror{padding-left:12px;padding-right:14px}header{padding:0 16px}.create span{display:none}.create{padding:0 14px}main{grid-template-columns:1fr}.code{border-right:0;border-bottom:1px solid var(--border);height:64vh}.tbtn span{display:none}.tbtn{width:34px;padding:0;justify-content:center}.ed{font-size:13.5px}}
.rungrp{display:inline-flex;align-items:center;gap:6px}
.lsel{height:34px;max-width:130px;border:1px solid var(--border);background:var(--bg);color:var(--text2);border-radius:8px;padding:0 8px;font:500 13px Inter,sans-serif;cursor:pointer}
.lsel:hover{border-color:var(--accent)}
.out{position:relative}
.rz{position:absolute;top:-4px;left:0;right:0;height:9px;cursor:ns-resize;z-index:3;touch-action:none}
.rz::after{content:"";position:absolute;left:50%;top:3px;width:36px;height:3px;margin-left:-18px;border-radius:3px;background:var(--border);transition:background .2s}
.rz:hover::after{background:var(--accent)}
.out.max{position:absolute;inset:0;height:auto!important;z-index:5;border:0}
.split{flex:1;min-height:0;display:flex}
.sti{flex:none;width:36%;min-width:0;display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-right:1px solid var(--border)}
.sti label{font:600 11px Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sti textarea{flex:1;min-height:0;width:100%;resize:none;font:400 13px/1.5 'JetBrains Mono',monospace;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;outline:0}
.sti textarea:focus{border-color:var(--accent)}
.split .obody{flex:1;min-width:0}
@media(max-width:900px){.split{flex-direction:column}.sti{width:auto;height:96px;border-right:0;border-bottom:1px solid var(--border)}}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.sb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--border);border-radius:12px;background:var(--sub);color:var(--text2);font-size:12.5px;font-weight:500;text-decoration:none;cursor:pointer;transition:transform .2s var(--ease),color .2s,border-color .2s}
.sb:hover{color:var(--c,var(--accent));border-color:var(--c,var(--accent));transform:translateY(-2px)}
.sb:active{transform:scale(.95)}
.sb.off{color:var(--c);opacity:.45;pointer-events:none;cursor:default}
.eln{color:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;border-radius:3px}
.eln:hover{background:rgba(239,68,68,.18)}
.edit .gut .eg{color:#ef4444;font-weight:700;background:rgba(239,68,68,.14)}
.row.eg{background:rgba(239,68,68,.1)}.row.eg .n{color:#ef4444;font-weight:700}
.edit{position:relative}.edit textarea{position:relative;z-index:1}
.hlay{position:absolute;left:77px;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;padding:0 28px 0 20px;font:inherit;line-height:30px;white-space:pre;color:transparent;z-index:0}
.hlay mark{background:rgba(250,204,21,.38);color:transparent;border-radius:3px}.hlay mark.cur{background:rgba(249,115,22,.6)}
.row.sm .c{background:rgba(250,204,21,.12)}
::highlight(sm){background:rgba(250,204,21,.4)}
::highlight(sc){background:rgba(249,115,22,.6)}
.sbar{position:absolute;top:52px;right:18px;z-index:8;display:flex;align-items:center;gap:2px;padding:5px 6px;background:var(--bg);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.sbar[hidden]{display:none}
.sbar input{width:190px;height:28px;border:0;outline:0;background:var(--sub);color:var(--text);border-radius:7px;padding:0 10px;font:400 13px 'JetBrains Mono',monospace}

function parseProblems(raw,lang){
  const t=raw.replace(ANSIRX,'').replace(/[\u2018\u2019\u00b4`]/g,"'"),code=($('ta')&&$('ta').value)||(cur&&cur.code)||'',max=code.split('\n').length,out=[],seen=new Set();
  const push=(sev,ln,col,msg)=>{ln-=RUNOFF;if(!(ln>=1&&ln<=max))return;const k=sev+ln+':'+col+msg;if(seen.has(k))return;seen.add(k);out.push({sev,ln,col,msg:msg.trim()})};
  for(const l of t.split('\n')){
    let m=/^(?:.*[\\\/])?([\w.+-]+\.\w{1,6}):(\d+):(?:(\d+):)?\s*(fatal error|error|warning):\s*(.+)$/.exec(l);
    if(m&&!/\.(h|hpp|hh|hxx|tcc)$/i.test(m[1])){push(m[4]==='warning'?'warning':'error',+m[2],+(m[3]||0),m[5]);continue}
    m=/^(?:.*[\\\/])?([\w.+-]+\.cs)\((\d+),(\d+)\):\s*(error|warning)\s*([^:]*:\s*)?(.+)$/.exec(l);
    if(m)push(m[4],+m[2],+m[3],m[6]);
  }
  const fr=[...t.matchAll(/File "((?:(?!\/(?:usr|lib|opt)\/|site-packages|_pyodide)[^"])+)", line (\d+)/g)];
  if(fr.length){const ex=[...t.matchAll(/^(\w*(?:Error|Exception|Exit|Interrupt)\b.*)$/gm)].pop();if(ex)push('error',+fr[fr.length-1][2],0,ex[1])}
  const jv=/^(Exception in thread.*|\S*Exception.*)$/m.exec(t),at=/\((\w+\.java):(\d+)\)/.exec(t);
  if(lang==='Java'&&jv&&at)push('error',+at[2],0,jv[1]);
  return out;
}
function renderProblems(){

  if(!n){const d=document.createElement('div');d.className='pempty';d.textContent=ranOnce?'No problems detected.':'Run your code to see problems here.';box.appendChild(d)}
  for(const p of PROBS){

    r.innerHTML='<span class="pi">'+(p.sev==='error'?'\u2716':'\u26A0')+'</span><span class="pm"></span><span class="pl"></span>';

}

    stat.textContent='HTML preview · sandboxed';return;
  }
  const nl=code.split('\n').length;
  let n=0,chars=0,capped=false;
  const add=(cls,txt)=>{
    if(capped)return;n++;chars+=txt.length;
    if(n>500||chars>100000){capped=true;cls='sys';txt='… output truncated'}
    const d=document.createElement('div');d.className='ol '+cls;if(cls==='error'){txt=txt.replace(ANSIRX,'');d.innerHTML=linkErrs(txt,nl);noteErr(txt)}else if(/[\x1b\r]/.test(txt))d.appendChild(ansiFrag(txt));else d.textContent=txt;body.appendChild(d);body.scrollTop=body.scrollHeight;
  };
  stat.textContent='Running…';
  if(lang==='Python'&&!saver()&&!pyBad&&!inter){runPy(code,add,stat);return}
  if(lang!=='JavaScript'){runRemote(code,lang,add,stat,inter);return}
  let url;
  try{url=URL.createObjectURL(new Blob([WSRC],{type:'text/javascript'}));wk=new Worker(url)}catch(e){stat.textContent='Failed';return add('error','Could not start the runner in this browser')}
  const end=()=>{stopRun();URL.revokeObjectURL(url)};
  wk.onmessage=e=>{
    const {t,a}=e.data;
    if(t==='done'){stat.textContent='Finished in '+a+' ms';if(!n)add('sys','(no output)');end()}
    else if(t==='result')add('result','← '+a);
    else add(t==='info'||t==='debug'?'log':t,a);
  };
  wk.onerror=e=>{add('error',e.message||'Script error');stat.textContent='Failed';end()};
  wt=setTimeout(()=>{add('error','Stopped: ran for more than 10 seconds');stat.textContent='Timed out';end()},10000);
  wk.postMessage(code);
}
$('oclear').onclick=()=>{$('obody').innerHTML=''};
$('oclose').onclick=closeOut;
$('rerun').onclick=runCode;
$('ostop').onclick=()=>ctrlC();
$('stdin').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&!e.shiftKey){e.preventDefault();runCode()}});
$('ocopy').onclick=async()=>{await copy($('obody').innerText);toast('Output copied')};
$('omax').onclick=()=>{const m=$('out').classList.toggle('max');$('omax').innerHTML=`<i data-lucide="${m?'minimize-2':'maximize-2'}" width="14"></i>`;icons()};
$('rz').onpointerdown=e=>{e.preventDefault();const o=$('out'),y0=e.clientY,h0=o.offsetHeight;
  const mv=v=>{o.style.height=Math.max(90,Math.min(innerHeight*.8,h0+y0-v.clientY))+'px'},up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up)};
/* ---------- router ---------- */
let routed=null;
async function route(h=location.hash.replace(/^#\/?/,'')||pathId()){
  if(h===routed)return;routed=h;
  const emb=h.startsWith('embed/');document.body.classList.toggle('embed',emb);
  const id=(emb?h.slice(6):h).toLowerCase();
  if(PATH_ROUTING&&LINK_BASE&&validId(id)){const want='/'+(emb?'embed/':'')+id;if(location.pathname!==want&&location.pathname.toLowerCase().replace(/\/$/,'')===want){try{history.replaceState(null,'',want+location.search)}catch(e){}}}
  if(id==='new'||id===''){editing=null;seed=forkSeed;forkSeed='';showEditor();return}
  if(!validId(id)){showMissing();return}
  const sid=id;showLoading();
  const p=await fetchPaste(sid);if(routed!==h)return;
  if(p&&p.error){showMissing(true);return}
  p?showView(sid,p):showMissing();
}
let lastNav=0;
function nav(h){
  if(PATH_ROUTING&&LINK_BASE){try{history.pushState(null,'','/'+(h==='new'?'':h))}catch(e){}route(h)}
  else{route(h);lastNav=Date.now();try{location.hash=h}catch(e){}}
}
addEventListener('hashchange',()=>route());
addEventListener('popstate',()=>{if(Date.now()-lastNav<150)return;routed=null;route()});

/* ---------- theme ---------- */
const root=document.documentElement;
function apply(t){root.dataset.theme=t;$('tg').dataset.t=t;$('light').classList.toggle('on',t==='light');$('dark').classList.toggle('on',t==='dark');try{localStorage.setItem('theme',t)}catch(e){}}
function setTheme(t,ev){
  if(root.dataset.theme===t)return;
  if(!ev||!document.startViewTransition||reduce){apply(t);return}
  const r=ev.currentTarget.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  const rad=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(()=>apply(t)).ready.then(()=>root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${rad}px at ${x}px ${y}px)`]},{duration:700,easing:'cubic-bezier(.4,0,.2,1)',pseudoElement:'::view-transition-new(root)'}));
}
$('light').onclick=e=>setTheme('light',e);$('dark').onclick=e=>setTheme('dark',e);
let s=null;try{s=localStorage.getItem('theme')}catch(e){}
apply(s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
icons();route();
